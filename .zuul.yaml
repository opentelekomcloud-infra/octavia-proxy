# eco2 (otcinfra2) only provides the Debian python-tox pod
# (quay.io/opentelekomcloud/python-tox:latest, Python 3.11 only).
- nodeset:
    name: octavia-proxy-debian
    nodes:
      - name: debian
        label: zuul-debian

- job:
    name: octavia-proxy-tox-pep8
    parent: otc-tox-pep8
    nodeset: octavia-proxy-debian
    description: |
      Run pep8/lint on the Debian (py3.11) pod

- job:
    name: octavia-proxy-tox-py311-tips
    parent: otc-tox-py311
    nodeset: octavia-proxy-debian
    description: |
      Run unit tests (py3.11) with latest dependencies on the Debian pod
    required-projects:
      - name: opentelekomcloud/python-otcextensions
        override-checkout: master

- job:
    name: octavia-proxy-tox-functional
    parent: otc-tox
    nodeset: octavia-proxy-debian
    description: |
      Run functional tests (py3.11) on the Debian pod
    vars:
      tox_envlist: functional
      python_version: "3.11"
    required-projects:
      - name: opentelekomcloud/python-otcextensions
        override-checkout: elb

- job:
    name: octavia-proxy-build-image
    parent: otc-build-docker-image
    description: Build octavia-proxy container image
    provides: octavia-proxy-container-image
    required-projects:
      - name: opentelekomcloud/python-otcextensions
        override-checkout: master
    vars: &octavia-proxy_image_vars
      zuul_work_dir: "{{ zuul.projects['github.com/opentelekomcloud-infra/octavia-proxy'].src_dir }}"
      docker_images:
        - context: .
          repository: opentelekomcloud/octavia-proxy
          tags:
            &imagetag "{{ zuul.tag is defined | ternary([zuul.get('tag', '').split('.')[0], '.'.join(zuul.get('tag', '').split('.')[:2]), zuul.get('tag', '')], ['latest']) }}"
          siblings:
            - github.com/opentelekomcloud/python-otcextensions

- job:
    name: octavia-proxy-upload-image
    parent: otcinfra-upload-image-quay
    provides: octavia-proxy-container-image
    required-projects:
      - name: opentelekomcloud/python-otcextensions
        override-checkout: master
    vars: *octavia-proxy_image_vars

- project:
    merge-mode: squash-merge
    default-branch: main
    vars:
      sphinx_pdf_files:
        - "doc-octavia-proxy.pdf"
        - "api-ref-octavia-proxy.pdf"
    templates:
      - publish-to-pypi
      - publish-otc-docs-hc-pti
      - api-ref-hc-jobs
      - release-notes-jobs
    check:
      jobs:
        - octavia-proxy-tox-pep8
        - octavia-proxy-tox-py311-tips
        - octavia-proxy-tox-functional
    gate:
      jobs:
        - octavia-proxy-tox-pep8
        - octavia-proxy-tox-py311-tips
        - octavia-proxy-tox-functional
    promote:
      jobs:
        - infra-prod-propose-octavia-proxy-image-stable:
            vars: &imagevars
              value: "quay.io/opentelekomcloud/octavia-proxy:{{ ('change_' + zuul.change) if (zuul.change is defined) else zuul.pipeline }}_latest"
        - infra-prod-propose-octavia-proxy-image-latest:
            vars: *imagevars
